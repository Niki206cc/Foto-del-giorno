services:
  foto-del-giorno:
    build: .
    container_name: foto-del-giorno
    restart: unless-stopped
    ports:
      - "8090:8090"
    environment:
      TZ: Europe/Rome
      APP_SECRET_KEY: ${APP_SECRET_KEY:-cambia-questa-chiave}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8090/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
